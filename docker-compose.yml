services:
  postgres-cestabasica:
    image: postgres:15
    container_name: postgres-cestabasica
    restart: unless-stopped
    environment:
      POSTGRES_DB: cestabasica_teste
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_cestabasica_data:/var/lib/postgresql/data

volumes:
  postgres_cestabasica_data:
